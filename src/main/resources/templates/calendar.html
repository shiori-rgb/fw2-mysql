<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${calendarTitle}">カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container calendar-page">
        <nav class="language-switcher">
            <a class="language-flag language-flag--ja" href="?lang=ja" title="日本語" aria-label="日本語">🇯🇵</a>
            <a class="language-flag language-flag--en" href="?lang=en" title="English" aria-label="English">🇬🇧</a>
        </nav>
        <h1 class="page-title" th:text="${calendarTitle}">カレンダー</h1>

        <nav class="calendar-nav" th:attr="aria-label=#{calendar.navigation}">
            <div class="calendar-nav__left">
                <a class="btn sub" th:if="${view == 'month'}" th:href="@{/calendar(year=${previous.year},month=${previous.monthValue},view='month')}" th:text="#{common.previousMonth}">前の月</a>
                <a class="btn sub" th:if="${view == 'month'}" th:href="@{/calendar(year=${next.year},month=${next.monthValue},view='month')}" th:text="#{common.nextMonth}">次の月</a>
                <a class="btn sub" th:if="${view == 'week'}" th:href="@{/calendar(view='week',date=${previous})}" th:text="#{common.previousWeek}">前の週</a>
                <a class="btn sub" th:if="${view == 'week'}" th:href="@{/calendar(view='week',date=${next})}" th:text="#{common.nextWeek}">次の週</a>
                <a class="btn sub" th:if="${view == 'day'}" th:href="@{/calendar(view='day',date=${previous})}" th:text="#{common.previous}">前へ</a>
                <a class="btn sub" th:if="${view == 'day'}" th:href="@{/calendar(view='day',date=${next})}" th:text="#{common.next}">次へ</a>
            </div>
            <div class="calendar-nav__right">
                <a class="btn sub" th:if="${view == 'month'}" th:href="@{/calendar(view='week',date=${from})}" th:text="#{common.viewWeek}">週で見る</a>
                <a class="btn sub" th:if="${view == 'week'}" th:href="@{/calendar(year=${year},month=${month},view='month')}" th:text="#{common.viewMonth}">月で見る</a>
                <a class="btn sub" th:if="${view != 'day'}" th:href="@{/calendar(view='day',date=${from})}" th:text="#{common.viewDay}">日で見る</a>
                <a class="btn sub" th:if="${view == 'day'}" th:href="@{/calendar(view='week',date=${from})}" th:text="#{common.viewWeek}">週で見る</a>
                <a class="btn sub" th:if="${view == 'day'}" th:href="@{/calendar(year=${year},month=${month},view='month')}" th:text="#{common.viewMonth}">月で見る</a>
                <a class="btn sub" href="/todos" th:text="#{common.tableView}">表で見る</a>
                <a class="btn sub" href="/burndown" th:text="#{common.burndown}">バーンダウンチャート</a>
                <a class="btn" href="/todos/new" th:text="#{common.new}">新規登録</a>
            </div>
        </nav>

        <div class="timeline-board" th:if="${timeline}" th:style="|--timeline-days:${#lists.size(timelineDates)}|" th:attr="data-from=${from},data-to=${to},data-view=${timelineView}">
            <div class="timeline-header">
                <div class="timeline-time-label"></div>
                <div class="timeline-date-label" th:each="date : ${timelineDates}" th:text="${date}">2026-11-26</div>
            </div>
            <div class="timeline-row" th:each="hour : ${timeSlots}">
                <div class="timeline-time-label" th:text="|${hour}:00|">9:00</div>
                <div class="timeline-slot" th:each="date : ${timelineDates}" th:attr="data-date=${date},data-hour=${hour}"></div>
            </div>
            <div class="timeline-now-line"></div>
            <div class="timeline-unscheduled">
                <h2 th:text="#{timeBlock.unscheduled}">時間未設定</h2>
                <div class="timeline-unscheduled-list"></div>
            </div>
        </div>

        <table class="calendar-table" th:unless="${timeline}" th:attr="data-from=${from},data-to=${to},data-todo-limit=${view == 'week' ? 0 : 3},data-holiday-error=#{calendar.holidayFetchFailed},data-sunny-label=#{weather.sunny},data-cloudy-label=#{weather.cloudy},data-rainy-label=#{weather.rainy}">
            <thead>
                <tr>
                    <th class="sunday">日</th>
                    <th>月</th>
                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                    <th class="saturday">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <th:block th:each="cell : ${week}">
                        <td class="calendar-cell calendar-cell--empty" th:if="${cell == null}"></td>
                        <td class="calendar-cell" th:unless="${cell == null}"
                            th:attr="data-date=${cell.date}">
                            <span class="calendar-day-number" th:text="${cell.day}">1</span>
                        </td>
                    </th:block>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        async function loadTimeline() {
            const board = document.querySelector('.timeline-board');
            const todos = await (await fetch(`/api/todos?from=${board.dataset.from}&to=${board.dataset.to}`)).json();
            const dates = [...document.querySelectorAll('.timeline-date-label')].map((element) => element.textContent);
            const slots = [...document.querySelectorAll('.timeline-slot')];
            const scheduled = todos.filter((todo) => todo.scheduledDate && todo.plannedStartTime && todo.plannedEndTime);
            const unscheduled = todos.filter((todo) => !todo.scheduledDate || !todo.plannedStartTime || !todo.plannedEndTime);
            const minutes = (time) => { const parts = time.split(':'); return Number(parts[0]) * 60 + Number(parts[1]); };
            const updateSchedule = async (id, date, startMinutes, endMinutes) => {
                const toTime = (value) => `${String(Math.floor(value / 60)).padStart(2, '0')}:${String(value % 60).padStart(2, '0')}`;
                await fetch(`/api/todos/${id}/schedule`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({scheduledDate: date, plannedStartTime: toTime(startMinutes), plannedEndTime: toTime(endMinutes), plannedMinutes: endMinutes - startMinutes}) });
                window.location.reload();
            };
            const addBlock = (todo) => {
                const start = minutes(todo.plannedStartTime);
                const end = minutes(todo.plannedEndTime);
                const slot = slots.find((candidate) => candidate.dataset.date === todo.scheduledDate && Number(candidate.dataset.hour) === Math.floor(start / 60));
                if (!slot) return;
                const block = document.createElement('div');
                block.className = 'time-block';
                block.draggable = true;
                block.dataset.todoId = todo.id;
                block.dataset.start = start;
                block.dataset.end = end;
                block.style.marginTop = `${(start % 60) * 1.2}px`;
                block.style.height = `${Math.max(28, (end - start) * 1.2)}px`;
                if (todo.projectColor) block.style.borderLeftColor = todo.projectColor;
                block.textContent = `${todo.plannedStartTime.slice(0, 5)} ${todo.title}`;
                const handle = document.createElement('span');
                handle.className = 'time-block-resize';
                block.appendChild(handle);
                block.addEventListener('dragstart', (event) => event.dataTransfer.setData('text/plain', todo.id));
                handle.addEventListener('mousedown', (event) => {
                    event.stopPropagation();
                    const startY = event.clientY;
                    const originalEnd = end;
                    const move = (moveEvent) => { block.style.height = `${Math.max(28, (originalEnd - start + Math.round((moveEvent.clientY - startY) / 1.2)) * 1.2)}px`; };
                    const up = async (upEvent) => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); const newEnd = Math.max(start + 15, originalEnd + Math.round((upEvent.clientY - startY) / 1.2)); await updateSchedule(todo.id, todo.scheduledDate, start, Math.min(1440, newEnd)); };
                    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
                });
                slot.appendChild(block);
            };
            slots.forEach((slot) => slot.addEventListener('dragover', (event) => event.preventDefault()));
            slots.forEach((slot) => slot.addEventListener('drop', async (event) => {
                event.preventDefault();
                const todo = todos.find((item) => String(item.id) === event.dataTransfer.getData('text/plain'));
                if (!todo) return;
                const duration = minutes(todo.plannedEndTime) - minutes(todo.plannedStartTime);
                const start = Number(slot.dataset.hour) * 60;
                await updateSchedule(todo.id, slot.dataset.date, start, Math.min(1440, start + duration));
            }));
            scheduled.forEach(addBlock);
            unscheduled.forEach((todo) => { const item = document.createElement('a'); item.className = 'timeline-unscheduled-item'; item.href = `/todos/${todo.id}/edit`; item.textContent = todo.title; document.querySelector('.timeline-unscheduled-list').appendChild(item); });
            const now = new Date();
            if (dates.includes(now.toISOString().slice(0, 10))) document.querySelector('.timeline-now-line').style.top = `${48 + (now.getHours() * 60 + now.getMinutes()) * 1.2}px`;
            for (let i = 0; i < scheduled.length; i++) for (let j = i + 1; j < scheduled.length; j++) if (scheduled[i].scheduledDate === scheduled[j].scheduledDate && minutes(scheduled[i].plannedStartTime) < minutes(scheduled[j].plannedEndTime) && minutes(scheduled[j].plannedStartTime) < minutes(scheduled[i].plannedEndTime)) document.querySelectorAll(`[data-todo-id="${scheduled[i].id}"], [data-todo-id="${scheduled[j].id}"]`).forEach((block) => block.classList.add('time-block--overlap'));
        }

        async function loadTodos() {
            const calendar = document.querySelector('.calendar-table');
            const from = calendar.dataset.from;
            const to = calendar.dataset.to;
            const res = await fetch(`/api/todos?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
            const todos = await res.json();
            const holidayRes = await fetch(`/api/holidays?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
            const holidays = await holidayRes.json();
            let weather = {};
            try {
                const weatherRes = await fetch(`/api/weather?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
                if (weatherRes.ok) {
                    weather = await weatherRes.json();
                }
            } catch (error) {
                weather = {};
            }

            if (holidayRes.headers.get('X-Holidays-Unavailable') === 'true') {
                const message = document.createElement('p');
                message.className = 'flash';
                message.textContent = calendar.dataset.holidayError;
                document.querySelector('.calendar-page').prepend(message);
            }

            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            document.querySelectorAll('[data-date]').forEach((cell) => {
                const date = cell.dataset.date;
                const dayOfWeek = new Date(`${date}T00:00:00`).getDay();

                if (dayOfWeek === 0) {
                    cell.classList.add('calendar-cell--sunday');
                } else if (dayOfWeek === 6) {
                    cell.classList.add('calendar-cell--saturday');
                }

                if (Object.prototype.hasOwnProperty.call(holidays, date)) {
                    cell.classList.add('calendar-cell--holiday');
                    cell.title = holidays[date];
                }

                const weatherType = weather[date];
                if (weatherType) {
                    const weatherMark = document.createElement('span');
                    weatherMark.className = `calendar-weather calendar-weather--${weatherType}`;
                    weatherMark.textContent = weatherType === 'sunny' ? '☀' : (weatherType === 'cloudy' ? '☁' : '☂');
                    weatherMark.setAttribute('aria-label', weatherType === 'sunny' ? calendar.dataset.sunnyLabel : (weatherType === 'cloudy' ? calendar.dataset.cloudyLabel : calendar.dataset.rainyLabel));
                    cell.appendChild(weatherMark);
                }

                const matchingTodos = todos.filter((todo) => todo.dueDate === date || (todo.dueDate == null && todo.scheduledDate === date));
                const todoLimit = Number(calendar.dataset.todoLimit);
                const visibleTodos = todoLimit === 0 ? matchingTodos : matchingTodos.slice(0, todoLimit);
                visibleTodos
                    .forEach((todo) => {
                        const title = document.createElement('div');
                        const link = document.createElement('a');
                        link.className = 'calendar-todo-link';
                        link.href = `/todos/${todo.id}/edit`;
                        link.textContent = todo.title;
                        if (todo.dueDate < today && !todo.completed) {
                            link.classList.add('calendar-todo--overdue');
                        }
                        title.appendChild(link);
                        cell.appendChild(title);
                    });

                if (todoLimit > 0 && matchingTodos.length > todoLimit) {
                    const more = document.createElement('div');
                    more.textContent = `ほか ${matchingTodos.length - todoLimit}件`;
                    cell.appendChild(more);
                }
            });
        }

        if (document.querySelector('.timeline-board')) loadTimeline(); else loadTodos();
    </script>
    <script src="/js/theme.js" defer></script>
    <script src="/js/sidebar.js" defer></script>
</body>
</html>
