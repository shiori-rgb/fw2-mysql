<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{todo.create.confirm}">登録内容の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title" th:text="#{todo.create.confirm}">登録内容の確認</h1>
        <nav class="language-switcher"><a href="?lang=ja" th:text="#{common.languageJapanese}">日本語</a> | <a href="?lang=en" th:text="#{common.languageEnglish}">English</a></nav>

        <p class="confirm-value"><span th:text="#{todo.title}">やること</span>：<span th:text="${#strings.isEmpty(todo.title) ? #messages.msg('common.inputNone') : todo.title}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.detail}">メモ</span>：<span th:text="${#strings.isEmpty(todo.detail) ? #messages.msg('common.inputNone') : todo.detail}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.category}">ジャンル</span>：<span th:text="${#strings.isEmpty(todo.category) ? #messages.msg('common.inputNone') : todo.category}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.priority}">優先度</span>：<span th:text="${todo.priority == null ? #messages.msg('common.inputNone') : (todo.priority == 1 ? #messages.msg('todo.priority.high') : (todo.priority == 2 ? #messages.msg('todo.priority.middle') : #messages.msg('todo.priority.low')))}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.dueDate}">期限</span>：<span th:text="${todo.dueDate == null ? #messages.msg('common.inputNone') : todo.dueDate}"></span></p>

        <form th:object="${todo}" method="post">
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{detail}">
            <input type="hidden" th:field="*{category}">
            <input type="hidden" th:field="*{priority}">
            <input type="hidden" th:field="*{dueDate}">

            <div class="confirm-actions">
                <button class="btn" type="submit" formaction="/todos" th:text="#{common.register}">登録する</button>
                <button class="btn sub" type="submit" formaction="/todos/new" th:text="#{common.rewrite}">書き直す</button>
            </div>
        </form>
    </div>
</body>
</html>
