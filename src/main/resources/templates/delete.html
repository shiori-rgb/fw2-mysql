<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{todo.delete.confirm}">削除の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title" th:text="#{todo.delete.confirm}">削除の確認</h1>
        <nav class="language-switcher">
            <a class="language-flag language-flag--ja" href="?lang=ja" title="日本語" aria-label="日本語">🇯🇵</a>
            <a class="language-flag language-flag--en" href="?lang=en" title="English" aria-label="English">🇬🇧</a>
        </nav>

        <p class="confirm-value"><span th:text="#{todo.title}">やること</span>：<span th:text="${#strings.isEmpty(todo.title) ? #messages.msg('common.inputNone') : todo.title}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.category}">ジャンル</span>：<span th:text="${#strings.isEmpty(todo.category) ? #messages.msg('common.inputNone') : todo.category}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.dueDate}">期限</span>：<span th:text="${todo.dueDate == null ? #messages.msg('common.inputNone') : todo.dueDate}"></span></p>

        <div class="confirm-actions">
            <form th:action="@{/todos/{id}/delete(id=${id})}" method="post">
                <button class="btn" type="submit" th:text="#{common.delete}">消す</button>
            </form>
            <a class="btn sub" href="/todos" th:text="#{common.cancel}">やめる</a>
        </div>
    </div>
    <script src="/js/theme.js" defer></script>
    <script src="/js/sidebar.js" defer></script>
</body>
</html>
