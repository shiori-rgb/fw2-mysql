<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{todo.edit.confirm}">編集内容の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title" th:text="#{todo.edit.confirm}">編集内容の確認</h1>
        <nav class="language-switcher">
            <a class="language-flag language-flag--ja" href="?lang=ja" title="日本語" aria-label="日本語">🇯🇵</a>
            <a class="language-flag language-flag--en" href="?lang=en" title="English" aria-label="English">🇬🇧</a>
        </nav>

        <p class="confirm-value"><span th:text="#{todo.title}">やること</span>：<span th:text="${#strings.isEmpty(todo.title) ? #messages.msg('common.inputNone') : todo.title}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.detail}">メモ</span>：<span th:text="${#strings.isEmpty(todo.detail) ? #messages.msg('common.inputNone') : todo.detail}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.category}">ジャンル</span>：<span th:text="${#strings.isEmpty(todo.category) ? #messages.msg('common.inputNone') : todo.category}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.priority}">優先度</span>：<span th:text="${todo.priority == null ? #messages.msg('common.inputNone') : (todo.priority == 1 ? #messages.msg('todo.priority.high') : (todo.priority == 2 ? #messages.msg('todo.priority.middle') : #messages.msg('todo.priority.low')))}"></span></p>
        <p class="confirm-value"><span th:text="#{project.name}">プロジェクト</span>：<span th:text="${selectedProjectName}"></span></p>
        <p class="confirm-value"><span th:text="#{project.section}">セクション</span>：<span th:text="${selectedSectionName}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.dueDate}">期限</span>：<span th:text="${todo.dueDate == null ? #messages.msg('common.inputNone') : todo.dueDate}"></span></p>
        <p class="confirm-value"><span th:text="#{todo.completed}">完了</span>：<span th:text="${todo.completed == null ? #messages.msg('common.inputNone') : (todo.completed ? #messages.msg('todo.status.completed') : #messages.msg('todo.status.incomplete'))}"></span></p>

        <form th:object="${todo}" th:action="@{/todos/{id}(id=${id})}" method="post">
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{detail}">
            <input type="hidden" th:field="*{category}">
            <input type="hidden" th:field="*{priority}">
            <input type="hidden" th:field="*{dueDate}">
            <input type="hidden" th:field="*{projectId}">
            <input type="hidden" th:field="*{sectionId}">
            <input type="hidden" name="completed" th:value="${todo.completed}">

            <div class="confirm-actions">
                <button class="btn" type="submit" th:text="#{common.save}">保存する</button>
                <button class="btn sub" type="submit" th:formaction="@{/todos/{id}/edit(id=${id})}" th:text="#{common.rewrite}">書き直す</button>
            </div>
        </form>
    </div>
    <script src="/js/theme.js" defer></script>
    <script src="/js/sidebar.js" defer></script>
</body>
</html>
