<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="#{automation.editTitle}">自動化ルール</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="container automation-page"><h1 class="page-title" th:text="${rule.id == null ? #messages.msg('automation.new') : #messages.msg('automation.editTitle')}">自動化ルール</h1>
<form class="automation-form" method="post" action="/automation/save"><input type="hidden" name="id" th:value="${rule.id}">
<label><span th:text="#{automation.name}">ルール名</span><input class="form-input" name="name" required th:value="${rule.name}"></label>
<div class="automation-ifthen"><section><h2>IF</h2><label><span th:text="#{automation.condition}">実行条件</span><select class="form-input" id="conditionType" name="conditionType"><option value="OVERDUE">期限が過ぎたとき</option><option value="COMPLETED">タスクを完了したとき</option><option value="CREATED">タスクを新規登録したとき</option><option value="START_TIME">開始予定時刻になったとき</option><option value="DAILY_TIME">毎日指定時刻</option><option value="WEEKLY_TIME">毎週指定曜日・時刻</option><option value="DAILY_WORK_MINUTES">1日の目標作業時間</option><option value="WORK_MINUTES_OVER">指定作業時間を超えたとき</option><option value="PROJECT_COMPLETION">プロジェクト達成率</option><option value="DAILY_COMPLETION">1日の達成率（件数）</option><option value="RAIN_PROBABILITY">降水確率</option><option value="UNCOMPLETED_COUNT">未完了タスク件数</option></select></label><label><span th:text="#{automation.conditionValue}">条件の値・時刻</span><input class="form-input" id="conditionValue" name="conditionValue" th:value="${rule.conditionValue}" placeholder="例: 21:00 / 70"></label><label><span th:text="#{automation.conditionDetail}">条件の詳細</span><input class="form-input" name="conditionDetail" th:value="${rule.conditionDetail}" placeholder="例: SUNDAY|21:00"></label></section><section><h2>THEN</h2><label><span th:text="#{automation.action}">実行する処理</span><select class="form-input" name="actionType"><option value="CHANGE_PRIORITY">優先度を変更</option><option value="CHANGE_CATEGORY">ジャンルを変更</option><option value="MOVE_PROJECT">プロジェクトに移動</option><option value="IN_APP_NOTIFICATION">アプリ内通知</option><option value="BROWSER_NOTIFICATION">ブラウザ通知</option><option value="SUGGEST_RESCHEDULE">予定変更を提案</option><option value="CREATE_TASK">新しいタスクを作成</option><option value="SUGGEST_BREAK">休憩を提案</option><option value="SUGGEST_REVIEW">振り返りを提案</option><option value="CELEBRATE">お祝いを表示</option><option value="CUSTOM_MESSAGE">カスタムメッセージ</option></select></label><label><span th:text="#{automation.actionValue}">処理の値</span><input class="form-input" name="actionValue" th:value="${rule.actionValue}" placeholder="例: 1 / 作成するタスク名"></label><label><span th:text="#{automation.actionDetail}">処理の詳細</span><input class="form-input" name="actionDetail" th:value="${rule.actionDetail}"></label></section></div>
<div class="settings-form-grid"><label><span th:text="#{automation.project}">対象プロジェクト</span><select class="form-input" name="targetProjectId"><option value="">すべて</option><option th:each="p : ${projects}" th:value="${p.id}" th:selected="${p.id == rule.targetProjectId}" th:text="${p.name}"></option></select></label><label><span th:text="#{automation.category}">対象ジャンル</span><select class="form-input" name="targetCategory"><option value="">すべて</option><option value="デザイン">デザイン</option><option value="マーケティング">マーケティング</option><option value="プログラミング">プログラミング</option><option value="資格">資格</option><option value="就職活動">就職活動</option></select></label></div>
<label class="settings-toggle"><input type="hidden" name="enabled" value="false"><input type="checkbox" name="enabled" value="true" th:checked="${rule.enabled}"><span th:text="#{automation.enabled}">このルールを有効にする</span></label><button class="btn" type="submit" th:text="#{common.save}">保存</button> <a class="btn sub" href="/automation" th:text="#{common.cancel}">キャンセル</a>
</form></main><script>const c=document.getElementById('conditionType'); const v=document.getElementById('conditionValue'); function update(){v.placeholder=['DAILY_TIME','WEEKLY_TIME'].includes(c.value)?'HH:mm または SUNDAY|21:00':'数値（分・件数・割合）';} c.addEventListener('change',update); update();</script><script src="/js/theme.js" defer></script><script src="/js/sidebar.js" defer></script></body></html>
