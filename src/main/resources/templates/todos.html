<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{todo.list.title}">やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container todo-list-page">
        <h1 class="page-title" th:text="#{todo.list.title}">やること一覧</h1>
        <nav class="language-switcher">
            <a class="language-flag language-flag--ja" href="?lang=ja" title="日本語" aria-label="日本語">🇯🇵</a>
            <a class="language-flag language-flag--en" href="?lang=en" title="English" aria-label="English">🇬🇧</a>
        </nav>

        <p class="flash" th:if="${message != null}" th:text="${message}"></p>

        <form class="search-bar" action="/todos" method="get">
            <input class="form-input" type="text" name="keyword" th:placeholder="#{common.searchPlaceholder}" th:value="${keyword}">
            <select class="form-input" name="category">
                <option value="" th:selected="${category == ''}" th:text="#{todo.category.all}">すべて</option>
                <option value="デザイン" th:selected="${category == 'デザイン'}" th:text="#{todo.category.design}">デザイン</option>
                <option value="マーケティング" th:selected="${category == 'マーケティング'}" th:text="#{todo.category.marketing}">マーケティング</option>
                <option value="プログラミング" th:selected="${category == 'プログラミング'}" th:text="#{todo.category.programming}">プログラミング</option>
                <option value="資格" th:selected="${category == '資格'}" th:text="#{todo.category.qualification}">資格</option>
                <option value="就職活動" th:selected="${category == '就職活動'}" th:text="#{todo.category.jobHunting}">就職活動</option>
            </select>
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="page" th:value="${page}">
            <input type="hidden" name="trash" th:value="${trash}">
            <input type="hidden" name="showCompleted" value="false" id="showCompletedValue">
            <label>
                <input type="checkbox" id="showCompletedCheckbox" th:checked="${showCompleted}">
                <span th:text="#{common.showCompleted}">完了したものも表示する</span>
            </label>
            <button class="btn" type="submit" th:text="#{common.filter}">絞り込む</button>
            <span class="order-links">
                <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc',showCompleted=${showCompleted},page=${page},trash=${trash})}" th:text="#{common.nearestDue}">期限が近い順</a>
                <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc',showCompleted=${showCompleted},page=${page},trash=${trash})}" th:text="#{common.farthestDue}">期限が遠い順</a>
            </span>
        </form>

        <script>
            document.querySelector('.search-bar').addEventListener('submit', () => {
                document.querySelector('#showCompletedValue').value =
                    document.querySelector('#showCompletedCheckbox').checked ? 'true' : 'false';
            });
        </script>

        <a class="btn" href="/todos/new" th:text="#{common.new}">新規登録</a>
        <a class="btn sub" href="/calendar" th:text="#{common.viewMonth}">カレンダーで見る</a>
        <a class="btn sub" href="/burndown" th:text="#{common.burndown}">バーンダウンチャート</a>
        <a class="btn sub"
           th:href="@{/api/todos.csv(keyword=${keyword},category=${category},order=${order},showCompleted=${showCompleted},trash=${trash})}" th:text="#{common.csv}">CSVで書き出す</a>
        <a class="btn sub" th:if="${trash == 0}" href="/todos?trash=1" th:text="#{common.showDeleted}">削除したものを見る</a>
        <a class="btn sub" th:if="${trash == 1}" href="/todos" th:text="#{common.backToNormal}">通常の一覧に戻る</a>

        <p th:if="${#lists.isEmpty(todos)}" th:text="#{common.noTodos}">まだ1件も登録されていません</p>

        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th th:text="#{todo.title}">やること</th>
                    <th th:text="#{todo.category}">ジャンル</th>
                    <th th:text="#{todo.priority}">優先度</th>
                    <th th:text="#{todo.dueDate}">期限</th>
                    <th th:text="#{todo.completed}">状態</th>
                    <th th:text="#{common.filter}">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:attr="data-due-date=${todo.dueDate},data-completed=${todo.completed}">
                    <td>
                        <span th:if="${todo.pinned}">★ </span>
                        <span th:text="${todo.title}"></span>
                    </td>
                    <td th:text="${todo.category}"></td>
                    <td>
                        <span th:text="${todo.priority == 1 ? #messages.msg('todo.priority.high') : (todo.priority == 2 ? #messages.msg('todo.priority.middle') : #messages.msg('todo.priority.low'))}"></span>
                        <span class="todo-priority-mark" th:if="${todo.priority == 1}" th:attr="aria-label=#{todo.priority.highest}">★</span>
                    </td>
                    <td th:text="${todo.dueDate}"></td>
                    <td>
                        <span th:text="${todo.completed ? #messages.msg('todo.status.completed') : #messages.msg('todo.status.incomplete')}"></span>
                        <span th:if="${todo.completed and todo.completedAt != null}"
                              th:text="| (${#temporals.format(todo.completedAt, 'yyyy-MM-dd HH:mm')})|"></span>
                    </td>
                    <td>
                        <div th:if="${trash == 0}">
                            <form th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post">
                                <input type="hidden" name="keyword" th:value="${keyword}">
                                <input type="hidden" name="category" th:value="${category}">
                                <input type="hidden" name="order" th:value="${order}">
                                <input type="hidden" name="showCompleted" th:value="${showCompleted}">
                                <input type="hidden" name="page" th:value="${page}">
                                <input type="hidden" name="trash" th:value="${trash}">
                                <button class="link" type="submit"
                                        th:text="${todo.pinned ? #messages.msg('todo.action.unpin') : #messages.msg('todo.action.pin')}"></button>
                            </form>
                            <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}" th:text="#{todo.action.edit}">編集</a>
                            <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}" th:text="#{todo.action.delete}">削除</a>
                        </div>
                        <form th:if="${trash == 1}" th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post">
                            <button class="link" type="submit" th:text="#{common.restore}">戻す</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <nav class="pagination" th:if="${totalPages > 1}" aria-label="ページ移動">
            <span th:each="pageNumber : ${#numbers.sequence(1, totalPages)}">
                <span th:if="${pageNumber == page}" th:text="${pageNumber}"></span>
                <a class="link" th:unless="${pageNumber == page}"
                   th:href="@{/todos(keyword=${keyword},category=${category},order=${order},showCompleted=${showCompleted},page=${pageNumber},trash=${trash})}"
                   th:text="${pageNumber}"></a>
            </span>
            <a class="language-flag language-flag--ja language-flag--pagination" th:href="@{/todos(keyword=${keyword},category=${category},order=${order},showCompleted=${showCompleted},page=${page},trash=${trash},lang='ja')}"
               title="日本語" aria-label="日本語">🇯🇵</a>
            <a class="language-flag language-flag--en language-flag--pagination" th:href="@{/todos(keyword=${keyword},category=${category},order=${order},showCompleted=${showCompleted},page=${page},trash=${trash},lang='en')}"
               title="English" aria-label="English">🇬🇧</a>
        </nav>
    </div>
    <script>
        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        document.querySelectorAll('.todo-table tbody tr').forEach((row) => {
            const dueDate = row.dataset.dueDate;
            const completed = row.dataset.completed === 'true';
            if (dueDate && dueDate < today && !completed) {
                row.classList.add('todo-row--overdue');
            }
        });
    </script>
    <script src="/js/theme.js" defer></script>
</body>
</html>
