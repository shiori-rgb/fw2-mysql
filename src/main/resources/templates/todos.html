<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{todo.list.title}">やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container todo-list-page">
        <h1 class="page-title" th:text="#{todo.list.title}">やること一覧</h1>
        <nav class="language-switcher">
            <a class="language-flag language-flag--ja" href="?lang=ja" title="日本語" aria-label="日本語">🇯🇵</a>
            <a class="language-flag language-flag--en" href="?lang=en" title="English" aria-label="English">🇬🇧</a>
        </nav>

        <p class="flash" th:if="${message != null}" th:text="${message}"></p>

        <form class="search-bar" action="/todos" method="get">
            <input class="form-input" type="text" name="keyword" th:placeholder="#{common.searchPlaceholder}" th:value="${keyword}">
            <select class="form-input" name="category">
                <option value="" th:selected="${category == ''}" th:text="#{todo.category.all}">すべて</option>
                <option value="デザイン" th:selected="${category == 'デザイン'}" th:text="#{todo.category.design}">デザイン</option>
                <option value="マーケティング" th:selected="${category == 'マーケティング'}" th:text="#{todo.category.marketing}">マーケティング</option>
                <option value="プログラミング" th:selected="${category == 'プログラミング'}" th:text="#{todo.category.programming}">プログラミング</option>
                <option value="資格" th:selected="${category == '資格'}" th:text="#{todo.category.qualification}">資格</option>
                <option value="就職活動" th:selected="${category == '就職活動'}" th:text="#{todo.category.jobHunting}">就職活動</option>
            </select>
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="page" th:value="${page}">
            <input type="hidden" name="trash" th:value="${trash}">
            <input type="hidden" name="showCompleted" value="false" id="showCompletedValue">
            <label>
                <input type="checkbox" id="showCompletedCheckbox" th:checked="${showCompleted}">
                <span th:text="#{common.showCompleted}">完了したものも表示する</span>
            </label>
            <button class="btn" type="submit" th:text="#{common.filter}">絞り込む</button>
            <span class="order-links">
                <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc',showCompleted=${showCompleted},page=${page},trash=${trash})}" th:text="#{common.nearestDue}">期限が近い順</a>
                <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc',showCompleted=${showCompleted},page=${page},trash=${trash})}" th:text="#{common.farthestDue}">期限が遠い順</a>
            </span>
        </form>

        <script>
            document.querySelector('.search-bar').addEventListener('submit', () => {
                document.querySelector('#showCompletedValue').value =
                    document.querySelector('#showCompletedCheckbox').checked ? 'true' : 'false';
            });
        </script>

        <a class="btn" href="/todos/new" th:text="#{common.new}">新規登録</a>
        <a class="btn sub" href="/calendar" th:text="#{common.viewMonth}">カレンダーで見る</a>
        <a class="btn sub" href="/burndown" th:text="#{common.burndown}">バーンダウンチャート</a>
        <a class="btn sub"
           th:href="@{/api/todos.csv(keyword=${keyword},category=${category},order=${order},showCompleted=${showCompleted},trash=${trash})}" th:text="#{common.csv}">CSVで書き出す</a>
        <a class="btn sub" th:if="${trash == 0}" href="/todos?trash=1" th:text="#{common.showDeleted}">削除したものを見る</a>
        <a class="btn sub" th:if="${trash == 1}" href="/todos" th:text="#{common.backToNormal}">通常の一覧に戻る</a>

        <div class="quick-schedule-toolbar" th:if="${trash == 0}">
            <span id="selectedTodoCount">選択中: 0件</span>
            <select class="form-input" id="bulkScheduleTarget"><option value="scheduled" th:text="#{quickSchedule.scheduledDate}">実行予定日</option><option value="due" th:text="#{todo.dueDate}">期限</option></select>
            <button class="link quick-schedule-choice" type="button" data-choice="today" th:text="#{quickSchedule.today}">今日</button>
            <button class="link quick-schedule-choice" type="button" data-choice="tomorrow" th:text="#{quickSchedule.tomorrow}">明日</button>
            <button class="link quick-schedule-choice" type="button" data-choice="dayAfterTomorrow" th:text="#{quickSchedule.dayAfterTomorrow}">明後日</button>
            <button class="link quick-schedule-choice" type="button" data-choice="weekend" th:text="#{quickSchedule.weekend}">週末</button>
            <button class="link quick-schedule-choice" type="button" data-choice="nextWeek" th:text="#{quickSchedule.nextWeek}">来週</button>
            <button class="link quick-schedule-choice" type="button" data-choice="oneWeek" th:text="#{quickSchedule.oneWeek}">1週間後</button>
            <input class="form-input" type="date" id="bulkScheduleDate">
            <button class="link" type="button" id="bulkScheduleCustom" th:text="#{quickSchedule.custom}">任意の日付</button>
            <button class="link" type="button" id="bulkScheduleNone" th:text="#{quickSchedule.none}">予定日なし</button>
            <button class="link" type="button" id="undoSchedule" hidden th:text="#{quickSchedule.undo}">取り消す</button>
        </div>

        <p th:if="${#lists.isEmpty(todos)}" th:text="#{common.noTodos}">まだ1件も登録されていません</p>

        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th th:text="#{quickSchedule.select}">選択</th>
                    <th th:text="#{todo.title}">やること</th>
                    <th th:text="#{todo.category}">ジャンル</th>
                    <th th:text="#{todo.priority}">優先度</th>
                    <th th:text="#{todo.dueDate}">期限</th>
                    <th th:text="#{timeBlock.title}">タイムブロック</th>
                    <th th:text="#{todo.completed}">状態</th>
                    <th th:text="#{common.filter}">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:attr="data-id=${todo.id},data-due-date=${todo.dueDate},data-scheduled-date=${todo.scheduledDate},data-start-time=${todo.plannedStartTime},data-end-time=${todo.plannedEndTime},data-planned-minutes=${todo.plannedMinutes},data-completed=${todo.completed}">
                    <td><input class="todo-select" type="checkbox" th:value="${todo.id}"></td>
                    <td>
                        <span th:if="${todo.pinned}">★ </span>
                        <span th:text="${todo.title}"></span>
                    </td>
                    <td th:text="${todo.category}"></td>
                    <td>
                        <span th:text="${todo.priority == 1 ? #messages.msg('todo.priority.high') : (todo.priority == 2 ? #messages.msg('todo.priority.middle') : #messages.msg('todo.priority.low'))}"></span>
                        <span class="todo-priority-mark" th:if="${todo.priority == 1}" th:attr="aria-label=#{todo.priority.highest}">★</span>
                    </td>
                    <td><button class="quick-schedule-trigger" type="button" data-target="due" th:if="${trash == 0}" th:text="${todo.dueDate == null ? #messages.msg('quickSchedule.none') : todo.dueDate}">期限なし</button><span th:if="${trash == 1}" th:text="${todo.dueDate == null ? #messages.msg('quickSchedule.none') : todo.dueDate}"></span></td>
                    <td>
                        <button class="quick-schedule-trigger" type="button" data-target="scheduled" th:if="${trash == 0}" th:text="${todo.scheduledDate == null ? #messages.msg('quickSchedule.none') : todo.scheduledDate}">予定日なし</button>
                        <span th:if="${trash == 1}" th:text="${todo.scheduledDate == null ? #messages.msg('quickSchedule.none') : todo.scheduledDate}"></span>
                        <span th:if="${todo.plannedStartTime != null}" th:text="| ${todo.plannedStartTime}| "></span>
                        <span th:if="${todo.plannedEndTime != null}" th:text="|〜 ${todo.plannedEndTime}| "></span>
                    </td>
                    <td>
                        <span th:text="${todo.completed ? #messages.msg('todo.status.completed') : #messages.msg('todo.status.incomplete')}"></span>
                        <span th:if="${todo.completed and todo.completedAt != null}"
                              th:text="| (${#temporals.format(todo.completedAt, 'yyyy-MM-dd HH:mm')})|"></span>
                    </td>
                    <td>
                        <div th:if="${trash == 0}">
                            <div class="timer-controls" th:attr="data-todo-id=${todo.id},data-status=${todo.timerStatus},data-started-at=${todo.timerStartedAt},data-actual-seconds=${todo.actualSeconds}">
                                <button class="link timer-button" type="button" data-action="start" th:if="${todo.timerStatus == null or todo.timerStatus == 'IDLE' or todo.timerStatus == 'STOPPED'}" th:text="#{timeBlock.start}">開始</button>
                                <button class="link timer-button" type="button" data-action="pause" th:if="${todo.timerStatus == 'RUNNING'}" th:text="#{timeBlock.pause}">一時停止</button>
                                <button class="link timer-button" type="button" data-action="resume" th:if="${todo.timerStatus == 'PAUSED'}" th:text="#{timeBlock.resume}">再開</button>
                                <button class="link timer-button" type="button" data-action="stop" th:if="${todo.timerStatus == 'RUNNING' or todo.timerStatus == 'PAUSED'}" th:text="#{timeBlock.stop}">終了</button>
                                <span th:text="#{timeBlock.actual}">実績</span>
                                <span class="timer-actual" th:text="${todo.actualSeconds == null ? 0 : todo.actualSeconds}">0:00:00</span>
                                <span th:if="${todo.plannedMinutes != null}" th:text="| / ${todo.plannedMinutes} #{timeBlock.minutes}|"> / 30 分</span>
                            </div>
                            <form th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post">
                                <input type="hidden" name="keyword" th:value="${keyword}">
                                <input type="hidden" name="category" th:value="${category}">
                                <input type="hidden" name="order" th:value="${order}">
                                <input type="hidden" name="showCompleted" th:value="${showCompleted}">
                                <input type="hidden" name="page" th:value="${page}">
                                <input type="hidden" name="trash" th:value="${trash}">
                                <button class="link" type="submit"
                                        th:text="${todo.pinned ? #messages.msg('todo.action.unpin') : #messages.msg('todo.action.pin')}"></button>
                            </form>
                            <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}" th:text="#{todo.action.edit}">編集</a>
                            <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}" th:text="#{todo.action.delete}">削除</a>
                        </div>
                        <form th:if="${trash == 1}" th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post">
                            <button class="link" type="submit" th:text="#{common.restore}">戻す</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <div id="quickScheduleMenu" class="quick-schedule-menu" hidden>
            <select class="form-input" id="quickScheduleTarget"><option value="scheduled" th:text="#{quickSchedule.scheduledDate}">実行予定日</option><option value="due" th:text="#{todo.dueDate}">期限</option></select>
            <button class="link quick-schedule-choice" type="button" data-choice="today" th:text="#{quickSchedule.today}">今日</button>
            <button class="link quick-schedule-choice" type="button" data-choice="tomorrow" th:text="#{quickSchedule.tomorrow}">明日</button>
            <button class="link quick-schedule-choice" type="button" data-choice="dayAfterTomorrow" th:text="#{quickSchedule.dayAfterTomorrow}">明後日</button>
            <button class="link quick-schedule-choice" type="button" data-choice="weekend" th:text="#{quickSchedule.weekend}">週末</button>
            <button class="link quick-schedule-choice" type="button" data-choice="nextWeek" th:text="#{quickSchedule.nextWeek}">来週</button>
            <button class="link quick-schedule-choice" type="button" data-choice="oneWeek" th:text="#{quickSchedule.oneWeek}">1週間後</button>
            <input class="form-input" type="date" id="quickScheduleDate">
            <button class="link" type="button" id="quickScheduleCustom" th:text="#{quickSchedule.custom}">任意の日付</button>
            <button class="link" type="button" id="quickScheduleNone" th:text="#{quickSchedule.none}">予定日なし</button>
        </div>
        <nav class="pagination" th:if="${totalPages > 1}" aria-label="ページ移動">
            <span th:each="pageNumber : ${#numbers.sequence(1, totalPages)}">
                <span th:if="${pageNumber == page}" th:text="${pageNumber}"></span>
                <a class="link" th:unless="${pageNumber == page}"
                   th:href="@{/todos(keyword=${keyword},category=${category},order=${order},showCompleted=${showCompleted},page=${pageNumber},trash=${trash})}"
                   th:text="${pageNumber}"></a>
            </span>
        </nav>
    </div>
    <script>
        function formatSeconds(value) {
            const seconds = Math.max(0, Math.floor(value));
            return `${Math.floor(seconds / 3600)}:${String(Math.floor(seconds / 60) % 60).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
        }
        function refreshTimerDisplays() {
            document.querySelectorAll('.timer-controls').forEach((control) => {
                let seconds = Number(control.dataset.actualSeconds || 0);
                if (control.dataset.status === 'RUNNING' && control.dataset.startedAt) {
                    seconds += Math.max(0, (Date.now() - new Date(control.dataset.startedAt).getTime()) / 1000);
                }
                const display = control.querySelector('.timer-actual');
                if (display) display.textContent = formatSeconds(seconds);
            });
        }
        document.querySelectorAll('.timer-button').forEach((button) => {
            button.addEventListener('click', async () => {
                const control = button.closest('.timer-controls');
                const response = await fetch(`/api/todos/${control.dataset.todoId}/timer/${button.dataset.action}`, { method: 'POST' });
                if (response.ok) window.location.reload();
            });
        });
        refreshTimerDisplays();
        setInterval(refreshTimerDisplays, 1000);

        const scheduleMenu = document.querySelector('#quickScheduleMenu');
        let activeScheduleRows = [];
        let lastScheduleChanges = null;
        const noneLabel = document.querySelector('#quickScheduleNone')?.textContent || '予定日なし';
        const selectedRows = () => [...document.querySelectorAll('.todo-select:checked')]
            .map((checkbox) => checkbox.closest('tr'));
        const dateText = (date) => date.toISOString().slice(0, 10);
        function quickDate(choice) {
            const date = new Date();
            date.setHours(12, 0, 0, 0);
            if (choice === 'tomorrow') date.setDate(date.getDate() + 1);
            if (choice === 'dayAfterTomorrow') date.setDate(date.getDate() + 2);
            if (choice === 'oneWeek') date.setDate(date.getDate() + 7);
            if (choice === 'weekend') date.setDate(date.getDate() + ((6 - date.getDay() + 7) % 7));
            if (choice === 'nextWeek') date.setDate(date.getDate() + ((7 - date.getDay()) % 7 || 7));
            return dateText(date);
        }
        function rowState(row) {
            return {
                scheduledDate: row.dataset.scheduledDate || null,
                dueDate: row.dataset.dueDate || null,
                plannedStartTime: row.dataset.startTime || null,
                plannedEndTime: row.dataset.endTime || null,
                plannedMinutes: row.dataset.plannedMinutes ? Number(row.dataset.plannedMinutes) : null
            };
        }
        function updateRowDate(row, result) {
            row.dataset.scheduledDate = result.scheduledDate || '';
            row.dataset.dueDate = result.dueDate || '';
            const scheduledButton = row.querySelector('.quick-schedule-trigger[data-target="scheduled"]');
            const dueButton = row.querySelector('.quick-schedule-trigger[data-target="due"]');
            if (scheduledButton) scheduledButton.textContent = result.scheduledDate || noneLabel;
            if (dueButton) dueButton.textContent = result.dueDate || noneLabel;
        }
        async function sendSchedule(row, state) {
            const response = await fetch(`/api/todos/${row.dataset.id}/schedule`, {
                method: 'PUT', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(state)
            });
            if (!response.ok) throw new Error('schedule update failed');
            const result = await response.json();
            updateRowDate(row, result);
            return result;
        }
        async function applyQuickSchedule(rows, target, date) {
            if (!rows.length) return;
            if (target === 'scheduled' && date && rows.some((row) => row.dataset.dueDate && date > row.dataset.dueDate)
                    && !window.confirm('実行予定日が期限を超えるタスクがあります。変更しますか？')) return;
            const before = rows.map((row) => ({row, state: rowState(row)}));
            const states = before.map(({row, state}) => ({row, state: {...state, [target === 'scheduled' ? 'scheduledDate' : 'dueDate']: date}}));
            try {
                await Promise.all(states.map(({row, state}) => sendSchedule(row, state)));
                lastScheduleChanges = before;
                const undo = document.querySelector('#undoSchedule');
                if (undo) undo.hidden = false;
                localStorage.setItem('todo-schedule-changed', String(Date.now()));
                if (scheduleMenu) scheduleMenu.hidden = true;
            } catch (error) {
                window.alert('予定を変更できませんでした。');
            }
        }
        document.querySelectorAll('.todo-select').forEach((checkbox) => checkbox.addEventListener('change', () => {
            const count = document.querySelectorAll('.todo-select:checked').length;
            const label = document.querySelector('#selectedTodoCount');
            if (label) label.textContent = `選択中: ${count}件`;
        }));
        document.querySelectorAll('.quick-schedule-trigger').forEach((trigger) => trigger.addEventListener('click', () => {
            activeScheduleRows = [trigger.closest('tr')];
            document.querySelector('#quickScheduleTarget').value = trigger.dataset.target;
            scheduleMenu.hidden = false;
        }));
        document.querySelectorAll('.quick-schedule-choice').forEach((button) => button.addEventListener('click', () => {
            const bulk = button.closest('.quick-schedule-toolbar');
            const rows = bulk ? selectedRows() : activeScheduleRows;
            const target = bulk ? document.querySelector('#bulkScheduleTarget').value : document.querySelector('#quickScheduleTarget').value;
            applyQuickSchedule(rows, target, quickDate(button.dataset.choice));
        }));
        document.querySelector('#quickScheduleCustom')?.addEventListener('click', () => applyQuickSchedule(activeScheduleRows, document.querySelector('#quickScheduleTarget').value, document.querySelector('#quickScheduleDate').value || null));
        document.querySelector('#quickScheduleNone')?.addEventListener('click', () => applyQuickSchedule(activeScheduleRows, document.querySelector('#quickScheduleTarget').value, null));
        document.querySelector('#bulkScheduleCustom')?.addEventListener('click', () => applyQuickSchedule(selectedRows(), document.querySelector('#bulkScheduleTarget').value, document.querySelector('#bulkScheduleDate').value || null));
        document.querySelector('#bulkScheduleNone')?.addEventListener('click', () => applyQuickSchedule(selectedRows(), document.querySelector('#bulkScheduleTarget').value, null));
        document.querySelector('#undoSchedule')?.addEventListener('click', async () => {
            if (!lastScheduleChanges) return;
            await Promise.all(lastScheduleChanges.map(({row, state}) => sendSchedule(row, state)));
            localStorage.setItem('todo-schedule-changed', String(Date.now()));
            document.querySelector('#undoSchedule').hidden = true;
            lastScheduleChanges = null;
        });

        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        document.querySelectorAll('.todo-table tbody tr').forEach((row) => {
            const dueDate = row.dataset.dueDate;
            const completed = row.dataset.completed === 'true';
            if (dueDate && dueDate < today && !completed) {
                row.classList.add('todo-row--overdue');
            }
        });
    </script>
    <script src="/js/theme.js" defer></script>
    <script src="/js/sidebar.js" defer></script>
</body>
</html>
