<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="#{automation.title}">自動化ルール</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="container automation-page"><h1 class="page-title" th:text="#{automation.title}">自動化ルール</h1>
<p class="flash" th:if="${automationSaved}" th:text="#{automation.saved}">保存しました。</p><p class="flash error" th:if="${automationError}" th:text="${automationError}"></p>
<div class="automation-notice" th:text="#{automation.notice}">ルールは有効化したときだけ、1分ごとの判定で実行されます。</div>
<div th:if="${testResults}" class="automation-test-result"><strong th:text="#{automation.testResult}">テスト結果</strong><p th:each="result : ${testResults}" th:text="${result}"></p><p th:if="${#lists.isEmpty(testResults)}" th:text="#{automation.noMatch}">現在一致する条件はありません。</p></div>
<a class="btn" href="/automation/new" th:text="#{automation.new}">新規ルール</a>
<div class="automation-list"><article class="automation-rule-card" th:each="rule : ${rules}"><div><h2 th:text="${rule.name}">ルール名</h2><p><span class="automation-badge" th:text="${rule.enabled ? '有効' : '無効'}">無効</span> <span th:text="|${rule.conditionType} → ${rule.actionType}|">条件 → 処理</span></p><small th:text="|実行回数: ${rule.executionCount}|">実行回数: 0</small></div><div class="automation-actions"><a class="btn sub" th:href="@{/automation/{id}/edit(id=${rule.id})}" th:text="#{common.edit}">編集</a><form method="post" th:action="@{/automation/{id}/toggle(id=${rule.id})}"><button class="btn sub" type="submit" th:text="${rule.enabled ? '無効にする' : '有効にする'}">有効にする</button></form><form method="post" th:action="@{/automation/{id}/test(id=${rule.id})}"><button class="btn sub" type="submit" th:text="#{automation.test}">テスト</button></form><form method="post" th:action="@{/automation/{id}/delete(id=${rule.id})}" onsubmit="return confirm('削除しますか？');"><button class="btn sub" type="submit" th:text="#{common.delete}">削除</button></form></div><details><summary th:text="#{automation.history}">実行履歴を見る</summary><ul class="automation-history"><li th:each="run : ${runsByRule[rule.id]}" th:text="|${run.executedAt} ${run.status}: ${run.message}|">履歴</li><li th:if="${#lists.isEmpty(runsByRule[rule.id])}" th:text="#{automation.noHistory}">履歴はありません。</li></ul></details></article><p th:if="${#lists.isEmpty(rules)}" th:text="#{automation.empty}">ルールはありません。</p></div>
<a class="btn sub" href="/settings" th:text="#{settings.title}">設定へ</a> <a class="btn sub" href="/todos" th:text="#{common.backToList}">一覧へ</a>
</main><script src="/js/theme.js" defer></script><script src="/js/sidebar.js" defer></script></body></html>
