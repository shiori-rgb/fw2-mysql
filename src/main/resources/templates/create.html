<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{todo.create.title}">やること登録</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title" th:text="#{todo.create.title}">やること登録</h1>
        <nav class="language-switcher">
            <a class="language-flag language-flag--ja" href="?lang=ja" title="日本語" aria-label="日本語">🇯🇵</a>
            <a class="language-flag language-flag--en" href="?lang=en" title="English" aria-label="English">🇬🇧</a>
        </nav>

        <form th:object="${todo}" action="/todos/confirm" method="post">
            <div class="form-row">
                <label class="form-label" for="title" th:text="#{todo.title}">やること</label>
                <input class="form-input" type="text" id="title" th:field="*{title}">
                <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>

            <div class="form-row">
                <label class="form-label" for="detail" th:text="#{todo.detail}">メモ</label>
                <input class="form-input" type="text" id="detail" th:field="*{detail}">
                <p class="error" th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}"></p>
            </div>

            <div class="form-row">
                <label class="form-label" for="category" th:text="#{todo.category}">ジャンル</label>
                <select class="form-input" id="category" th:field="*{category}">
                    <option value="" th:text="#{common.inputNone}">選択してください</option>
                    <option value="デザイン" th:text="#{todo.category.design}">デザイン</option>
                    <option value="マーケティング" th:text="#{todo.category.marketing}">マーケティング</option>
                    <option value="プログラミング" th:text="#{todo.category.programming}">プログラミング</option>
                    <option value="資格" th:text="#{todo.category.qualification}">資格</option>
                    <option value="就職活動" th:text="#{todo.category.jobHunting}">就職活動</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
            </div>

            <div class="form-row">
                <label class="form-label" for="priority" th:text="#{todo.priority}">優先度</label>
                <select class="form-input" id="priority" th:field="*{priority}">
                    <option value="" th:text="#{common.inputNone}">選択してください</option>
                    <option value="1" th:text="#{todo.priority.high}">高</option>
                    <option value="2" th:text="#{todo.priority.middle}">中</option>
                    <option value="3" th:text="#{todo.priority.low}">低</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></p>
            </div>

            <div class="form-row">
                <label class="form-label" for="projectId" th:text="#{project.name}">プロジェクト</label>
                <select class="form-input" id="projectId" th:field="*{projectId}">
                    <option value="" th:text="#{project.none}">プロジェクトなし</option>
                    <option th:each="project : ${projects}" th:value="${project.id}"
                            th:text="|${project.icon} ${project.name}|">プロジェクト</option>
                </select>
            </div>

            <div class="form-row">
                <label class="form-label" for="sectionId" th:text="#{project.section}">セクション</label>
                <select class="form-input" id="sectionId" th:field="*{sectionId}">
                    <option value="" th:text="#{project.section.none}">セクションなし</option>
                    <option th:each="section : ${projectSections}" th:value="${section.id}"
                            th:text="${section.name}">セクション</option>
                </select>
            </div>

            <div class="form-row">
                <label class="form-label" for="dueDate" th:text="#{todo.dueDate}">期限</label>
                <input class="form-input" type="date" id="dueDate" th:field="*{dueDate}">
            </div>

            <div class="form-row time-block-form">
                <h2 th:text="#{timeBlock.title}">タイムブロック</h2>
                <label class="form-label" for="scheduledDate" th:text="#{timeBlock.scheduledDate}">実行予定日</label>
                <input class="form-input" type="date" id="scheduledDate" th:field="*{scheduledDate}">
                <label class="form-label" for="plannedStartTime" th:text="#{timeBlock.startTime}">開始予定時間</label>
                <input class="form-input" type="time" id="plannedStartTime" th:field="*{plannedStartTime}">
                <label class="form-label" for="plannedEndTime" th:text="#{timeBlock.endTime}">終了予定時間</label>
                <input class="form-input" type="time" id="plannedEndTime" th:field="*{plannedEndTime}">
                <label class="form-label" for="plannedMinutes" th:text="#{timeBlock.plannedMinutes}">予定作業時間（分）</label>
                <input class="form-input" type="number" min="0" id="plannedMinutes" th:field="*{plannedMinutes}">
            </div>

            <button class="btn" type="submit" th:text="#{common.confirm}">確認する</button>
            <a class="btn sub" href="/todos" th:text="#{common.backToList}">一覧へ</a>
        </form>
    </div>
    <script src="/js/theme.js" defer></script>
    <script src="/js/sidebar.js" defer></script>
</body>
</html>
